<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <link rel="stylesheet" href="form.css"/>
</head>
<body>
    <h1 class="sport" >Sports Physical Form</h1>
    <form>
        <fieldset>
            <legend>Athlete Information</legend>
            <ul>
                <li>
               <label for="fname">Name:</label>
               <input type="text" id="fname" name="fname" />
               </li>
                
               <br>
               <li>
               <label for="fteam">School/TeamName:</label>
               <input type="text" id="fteam" name="fname" />
               </li>
<br>
               <li>
               <label for="fsport">Sport:</label>
               <input type="text" id="fname" name="fsport" />
               </li>
<br>
               <li>
               <label for="parent">Parent/Gardian:</label>
               <input type="text" id="parent" name="fparent" />
               </li>
                
<br>
              <li>
               <label for="Contact" class="contact">Contact:</label>
               <input type="text" id="Contact" name="fcontact"/>
               </li>
               </ul>
        </fieldset>

        <fieldset>
            <legend>Medical History of Athletes</legend>
            <ul>
            <li>
               <label for="f1">History of Concussions:</label>
              <input type="radio" id="i4" name="decision" value="i4">
                <label for="i4">yes</label>
                <input type="radio" id="i4-yes" name="decision" value="i4-yes">
                       <label for="i4">no</label>
               </li> 
                
<br>
               <li>
               <label for="f2">Previous Surgeries:</label>
               <input type="text" id="f2" name="fname"/>
               </li>
                   
<br>
                <li>
               <label for="f3">Any bone Fractures:</label>
              <input type="radio" id="i4" name="decision" value="i4">
                <label for="i4">yes</label>
                <input type="radio" id="i4-yes" name="decision" value="i4-yes">
                       <label for="i4">no</label>
               </li>
             <br>  
                <li>
               <label for="f4">Asthama or Breathing problem:</label>
               <input type="text" id="f2" name="fbreathing"/>
               </li>
               </ul>
        </fieldset>
        <fieldset>
            <legend>Fitness Assessment</legend>
            <table>
                <thead>
                    <tr>
                        <th rowspan="3">Category</th>
                        <th rowspan="2">Pass</th>
                        <th rowspan="2">Fail</th>
                        <th rowspan="4">Comments</th>
                        
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th>Cardivascular</th>
                        <th>[ ]</th>
                        <th>[ ]</th>
                        <th></th>
                        </tr>
                    <tr>
                        
                    </tr>
                </tbody>
            </table>
        </fieldset>
    </form>
</body>
</html>
